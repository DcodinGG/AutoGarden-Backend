<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoGarden — Smart Irrigation</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #020617;
      --card: #0f172a;
      --card-hover: #1e293b;
      --border: #334155;
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.2);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --font-ui: 'Inter', sans-serif;
      --font-heading: 'Fraunces', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle background glow */
    body::before {
      content: '';
      position: fixed; top: -10%; left: -10%;
      width: 40%; height: 40%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
      pointer-events: none; z-index: -1;
    }

    /* ── Header ── */
    header {
      backdrop-filter: blur(12px);
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      flex-wrap: wrap; gap: 0.75rem;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .logo span { color: var(--primary); }
    .logo i { color: var(--primary); }

    .status-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .pill {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.35rem 0.7rem; border-radius: 999px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--text-muted);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: all 0.3s; flex-shrink:0; }
    .dot.active { background: var(--primary); box-shadow: 0 0 6px var(--primary); }
    .dot.warn { background: var(--warning); box-shadow: 0 0 6px var(--warning); }
    .dot.error { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

    /* ── Layout ── */
    main {
      max-width: 1200px; margin: 0 auto;
      padding: 2rem;
      display: flex; flex-direction: column; gap: 1.5rem;
    }

    .grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1.5rem; }
    .col-span-12 { grid-column: span 12; }
    .col-span-8 { grid-column: span 8; }
    .col-span-4 { grid-column: span 4; }

    /* ── Overview stat strip ── */
    .stat-strip {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex; flex-direction: column; gap: 0.4rem;
      position: relative;
    }
    .stat-card .stat-icon-row { display:flex; align-items:center; justify-content:space-between; }
    .stat-card .stat-icon {
      width: 34px; height: 34px; border-radius: 0.6rem;
      display:flex; align-items:center; justify-content:center;
      background: rgba(16, 185, 129, 0.12); color: var(--primary);
    }
    .stat-card .stat-icon i { width: 18px; height: 18px; }
    .stat-card .stat-label {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--text-muted);
    }
    .stat-card .stat-value {
      font-family: var(--font-heading); font-size: 1.75rem; font-weight: 700;
      display:flex; align-items:baseline; gap: 0.4rem;
    }
    .stat-card .stat-value img { width: 30px; height: 30px; }
    .stat-card .stat-sub { font-size: 0.75rem; color: var(--text-muted); }
    .stat-card .stat-refresh {
      position: absolute; top: 0.9rem; right: 0.9rem;
      background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; padding: 0.2rem; border-radius: 0.3rem; transition: color 0.2s;
    }
    .stat-card .stat-refresh:hover { color: var(--primary); }
    .stat-card .stat-refresh i { width: 14px; height: 14px; }

    /* ── Components ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card-title {
      font-family: var(--font-heading);
      font-size: 1.25rem; font-weight: 700;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .card-title i { color: var(--primary); width: 20px; }
    .card-header-row {
      display:flex; justify-content:space-between; align-items:center;
      flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem;
    }

    /* ── Trend tabs ── */
    .tabs { display: flex; gap: 0.4rem; background: rgba(255,255,255,0.03); padding: 0.3rem; border-radius: 0.65rem; border: 1px solid var(--border); }
    .tab-btn {
      padding: 0.45rem 0.9rem; border-radius: 0.5rem; border: none;
      background: transparent; color: var(--text-muted);
      font-family: var(--font-ui); font-size: 0.8rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .tab-btn i { width: 14px; height: 14px; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { background: var(--primary); color: #000; }

    /* ── Plants Grid ── */
    .plants-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;
    }

    .plant-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .plant-item:hover {
      border-color: var(--primary);
      background: rgba(16, 185, 129, 0.03);
      transform: translateY(-2px);
    }
    .plant-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    .plant-id { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .plant-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .plant-species { font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin-bottom: 1rem; }

    .moisture-viz { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
    .progress-track { flex: 1; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .moisture-pct { font-weight: 700; font-size: 0.9rem; color: var(--primary); min-width: 35px; }

    .last-activity { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; background: var(--primary-glow); color: var(--primary); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 1rem; border-radius: 0.5rem;
      font-weight: 600; font-size: 0.85rem;
      cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
      font-family: var(--font-ui);
    }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-primary:hover { background: #34d399; transform: scale(1.02); }
    .btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
    .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.75rem; }

    /* ── Table ── */
    .table-container { overflow-x: auto; margin-top: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 1rem; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
    td { padding: 1rem; border-bottom: 1px solid rgba(51, 65, 85, 0.5); font-size: 0.85rem; }
    tr:hover td { background: rgba(255,255,255,0.01); }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px); z-index: 200;
      display: none; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 1.5rem; width: 100%; max-width: 500px;
      padding: 2rem; animation: modalIn 0.3s ease-out;
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .input-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; }
    input, textarea {
      width: 100%; background: #020617; border: 1px solid var(--border);
      border-radius: 0.5rem; padding: 0.75rem; color: var(--text);
      font-family: var(--font-ui); outline: none; transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--primary); }

    /* ── Analytics ── */
    .chart-container { height: 320px; margin-top: 0.5rem; }

    @media (max-width: 1024px) {
      .col-span-8, .col-span-4 { grid-column: span 12; }
      .stat-strip { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .stat-strip { grid-template-columns: 1fr; }
      main { padding: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i data-lucide="sprout"></i>
      Auto<span>Garden</span>
    </div>
    <div class="status-group">
      <div class="pill"><div id="dot-mqtt" class="dot"></div> MQTT</div>
      <div class="pill"><div id="dot-ai" class="dot"></div> <span id="ai-name">AI</span></div>
      <div class="pill"><div id="dot-wx" class="dot"></div> Weather</div>
      <div class="pill" id="uptime"><i data-lucide="clock" style="width:12px;height:12px;"></i> --:--</div>
    </div>
  </header>

  <main>

    <!-- ── Overview: at-a-glance stat strip ─────────────────────────── -->
    <div class="stat-strip">
      <div class="stat-card">
        <div class="stat-icon-row">
          <div class="stat-icon"><i data-lucide="droplets"></i></div>
        </div>
        <div class="stat-label">Soil Moisture</div>
        <div class="stat-value" id="stat-moisture">--%</div>
        <div class="stat-sub" id="stat-moisture-sub">No data yet</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-row">
          <div class="stat-icon"><i data-lucide="thermometer"></i></div>
        </div>
        <div class="stat-label">Indoor (DHT22)</div>
        <div class="stat-value" id="stat-indoor">--°C</div>
        <div class="stat-sub" id="stat-indoor-sub">No data yet</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-row">
          <div class="stat-icon"><i data-lucide="cloud-sun"></i></div>
          <button class="stat-refresh" id="btn-refresh-wx" onclick="refreshWeather()" title="Refresh weather">
            <i data-lucide="refresh-cw"></i>
          </button>
        </div>
        <div class="stat-label">Outdoor Weather</div>
        <div class="stat-value">
          <img id="wx-icon" src="" alt="" style="display:none;">
          <span id="stat-outdoor">--°C</span>
        </div>
        <div class="stat-sub" id="stat-outdoor-sub">--</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-row">
          <div class="stat-icon"><i data-lucide="brain-circuit"></i></div>
        </div>
        <div class="stat-label">Last AI Decision</div>
        <div class="stat-value" id="stat-decision" style="font-size:1.2rem;">--</div>
        <div class="stat-sub" id="stat-decision-sub">No data yet</div>
      </div>
    </div>

    <!-- ── Unified Trends chart with tab switcher ───────────────────── -->
    <div class="card">
      <div class="card-header-row">
        <div class="card-title"><i data-lucide="line-chart"></i> Trends</div>
        <div class="tabs">
          <button class="tab-btn active" data-tab="moisture" onclick="setActiveTrend('moisture')">
            <i data-lucide="droplets"></i> Soil Moisture
          </button>
          <button class="tab-btn" data-tab="ambient" onclick="setActiveTrend('ambient')">
            <i data-lucide="thermometer"></i> Ambient
          </button>
          <button class="tab-btn" data-tab="weather" onclick="setActiveTrend('weather')">
            <i data-lucide="cloud-rain"></i> Weather
          </button>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="trendsChart"></canvas>
      </div>
    </div>

    <!-- ── Plants Control ────────────────────────────────────────────── -->
    <div class="card">
      <div class="card-header-row">
        <div class="card-title"><i data-lucide="layout-grid"></i> Configured Pots</div>
        <button class="btn btn-primary" onclick="openAddModal()">
          <i data-lucide="plus"></i> Add New Pot
        </button>
      </div>
      <div id="plants-grid" class="plants-grid">
        <!-- Plants will be injected here -->
      </div>
    </div>

    <!-- ── Decision History ──────────────────────────────────────────── -->
    <div class="card">
      <div class="card-header-row">
        <div class="card-title"><i data-lucide="history"></i> Decision History</div>
        <button class="btn btn-outline btn-sm" onclick="loadHistory()">
          <i data-lucide="refresh-cw"></i> Refresh
        </button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Plant</th>
              <th>Moisture</th>
              <th>Status</th>
              <th>AI Reasoning</th>
              <th>Confidence</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <!-- History rows -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <h2 id="modal-title" style="font-family: var(--font-heading); margin-bottom: 1.5rem;">Add New Pot</h2>
      <input type="hidden" id="form-id">
      <div class="input-group">
        <label>Pot ID (ESP32 Mapping)</label>
        <input type="number" id="form-plant-id" placeholder="1">
      </div>
      <div class="input-group">
        <label>Plant Name</label>
        <input type="text" id="form-name" placeholder="Cherry Tomato">
      </div>
      <div class="input-group">
        <label>Botanical Species</label>
        <input type="text" id="form-species" placeholder="Solanum lycopersicum">
      </div>
      <div class="input-group">
        <label>Notes</label>
        <textarea id="form-notes" rows="3"></textarea>
      </div>
      <div style="display:flex; gap:1rem; justify-content:flex-end; margin-top: 2rem;">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="savePlant()">Save Configuration</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const api = {
      get:    (url) => fetch(url).then(r => r.json()),
      put:    (url, data) => fetch(url, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(r => r.json()),
      delete: (url) => fetch(url, { method:'DELETE' }).then(r => r.json()),
    };

    let plants = [];
    let history = [];
    let weatherHistory = [];
    let lastWeather = null;
    let editingId = null;

    let trendsChart = null;
    let activeTrend = 'moisture'; // 'moisture' | 'ambient' | 'weather'

    document.addEventListener('DOMContentLoaded', async () => {
      await loadStatus();
      await loadPlants();
      await loadHistory();
      await loadWeatherHistory();
      renderTrendsChart();
      setInterval(loadHistory, 30000);
      setInterval(loadStatus, 15000);
      setInterval(loadWeatherHistory, 60000);
    });

    // ── Status header ──────────────────────────────────────────────────

    async function loadStatus() {
      try {
        const s = await api.get('/api/status');
        setDot('dot-mqtt', s.mqtt_configured);
        setDot('dot-ai',   s.ai_configured);
        setDot('dot-wx',   s.weather_configured);
        document.getElementById('ai-name').textContent = (s.ai_engine || 'AI') + ' Engine';
        document.getElementById('uptime').innerHTML = `<i data-lucide="clock" style="width:12px; height:12px; vertical-align:middle;"></i> ${formatUptime(s.uptime_s)}`;
        lucide.createIcons();
      } catch { setDot('dot-mqtt', false, true); }
    }

    function setDot(id, active, error = false) {
      const el = document.getElementById(id);
      el.className = 'dot ' + (error ? 'error' : (active ? 'active' : 'warn'));
    }

    function formatUptime(s) {
      if (s < 60) return `${s}s`;
      if (s < 3600) return `${Math.floor(s/60)}m`;
      return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
    }

    // ── Plants ────────────────────────────────────────────────────────

    async function loadPlants() {
      plants = await api.get('/api/plants');
      renderPlants();
    }

    function renderPlants() {
      const grid = document.getElementById('plants-grid');
      const lastByPlant = {};
      history.forEach(h => { if (!lastByPlant[h.plant_id]) lastByPlant[h.plant_id] = h; });

      if (plants.length === 0) {
        grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding: 3rem;">No plants configured yet.</div>';
        return;
      }

      grid.innerHTML = plants.map(p => {
        const last = lastByPlant[p.id];
        const moisture = last?.moisture_pct ?? 0;
        const watered = last?.watered;

        return `
          <div class="plant-item" onclick="openEditModal(${p.id})">
            <div class="plant-header">
              <span class="plant-id">Pot #${p.id}</span>
              <div style="display:flex; gap:0.5rem;">
                <button class="btn btn-sm btn-outline btn-danger" onclick="event.stopPropagation(); deletePlantConfirm(${p.id})">
                  <i data-lucide="trash-2" style="width:14px;"></i>
                </button>
              </div>
            </div>
            <div class="plant-name">${p.name}</div>
            <div class="plant-species">${p.species || 'Common species'}</div>

            <div class="moisture-viz">
              <div class="progress-track"><div class="progress-fill" style="width:${moisture}%"></div></div>
              <span class="moisture-pct">${moisture}%</span>
            </div>

            <div class="last-activity">
              <i data-lucide="activity" style="width:12px;"></i>
              ${last ? `Last: ${formatDateShort(last.recorded_at)}` : 'No data yet'}
              ${watered ? `<span class="badge">WATERED ${last.water_secs}s</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // ── Sensor / decision history ────────────────────────────────────────

    async function loadHistory() {
      history = await api.get('/api/history?limit=50');
      renderHistory();
      renderPlants();
      updateOverview();
      if (activeTrend === 'moisture' || activeTrend === 'ambient') renderTrendsChart();
    }

    function renderHistory() {
      const tbody = document.getElementById('history-body');
      tbody.innerHTML = history.slice(0, 10).map(h => {
        let dec = {}; try { dec = JSON.parse(h.ai_decision); } catch {}
        return `
          <tr>
            <td style="color:var(--text-muted)">${formatDateShort(h.recorded_at)}</td>
            <td style="font-weight:600">${h.plant_name || `#${h.plant_id}`}</td>
            <td>
              <span style="color: ${h.moisture_pct < 30 ? 'var(--danger)' : 'var(--primary)'}">${h.moisture_pct}%</span>
            </td>
            <td>
              ${h.watered ? '<span style="color:var(--primary); font-weight:700;">✓ Watered</span>' : '<span style="color:var(--text-muted)">Skipped</span>'}
            </td>
            <td style="font-size:0.75rem; max-width: 300px; color:var(--text-muted)">${dec.reasoning || '---'}</td>
            <td>
              <span class="badge" style="background: ${dec.confidence === 'high' ? 'rgba(16,185,129,0.1)' : 'rgba(245,158,11,0.1)'}; color: ${dec.confidence === 'high' ? 'var(--primary)' : 'var(--warning)'}">${dec.confidence || '---'}</span>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Latest history entry that actually carries a valid DHT22 reading
    function latestAmbientReading() {
      return history.find(h => h.temperature != null && h.humidity != null);
    }

    // ── Weather ───────────────────────────────────────────────────────

    async function loadWeatherHistory() {
      weatherHistory = await api.get('/api/weather/history?limit=100');
      await updateWeather();
      updateOverview();
      if (activeTrend === 'weather') renderTrendsChart();
    }

    async function updateWeather() {
      try {
        const wx = await api.get('/api/weather');
        if (wx.error) return;
        lastWeather = wx;

        const iconEl = document.getElementById('wx-icon');
        if (wx.icon) {
          iconEl.src = `https://openweathermap.org/img/wn/${wx.icon}@2x.png`;
          iconEl.alt = wx.description || '';
          iconEl.style.display = 'inline-block';
        } else {
          iconEl.style.display = 'none';
        }
      } catch (err) { console.error('Weather update failed', err); }
    }

    async function refreshWeather() {
      const btn = document.getElementById('btn-refresh-wx');
      btn.style.animation = 'spin 1s linear infinite';
      try {
        await fetch('/api/weather/refresh', { method: 'POST' });
        await loadWeatherHistory();
      } finally {
        btn.style.animation = '';
      }
    }

    // ── Overview stat strip ──────────────────────────────────────────────

    function updateOverview() {
      // Soil moisture — most recent reading overall
      const latest = history[0];
      if (latest) {
        document.getElementById('stat-moisture').textContent = latest.moisture_pct + '%';
        document.getElementById('stat-moisture-sub').textContent =
          `${latest.plant_name || '#' + latest.plant_id} · ${formatDateShort(latest.recorded_at)}`;
      }

      // Indoor ambient (DHT22)
      const ambient = latestAmbientReading();
      if (ambient) {
        document.getElementById('stat-indoor').textContent = ambient.temperature.toFixed(1) + '°C';
        document.getElementById('stat-indoor-sub').textContent =
          `${ambient.humidity.toFixed(1)}% humidity · ${formatDateShort(ambient.recorded_at)}`;
      }

      // Outdoor weather
      if (lastWeather) {
        document.getElementById('stat-outdoor').textContent = lastWeather.temp + '°C';
        document.getElementById('stat-outdoor-sub').textContent =
          `${capitalize(lastWeather.description)} · ${lastWeather.humidity}% humidity`;
      }

      // Last AI decision
      if (latest) {
        let dec = {}; try { dec = JSON.parse(latest.ai_decision); } catch {}
        const decisionEl = document.getElementById('stat-decision');
        if (latest.watered) {
          decisionEl.textContent = '✓ Watered';
          decisionEl.style.color = 'var(--primary)';
        } else {
          decisionEl.textContent = 'Skipped';
          decisionEl.style.color = 'var(--text)';
        }
        document.getElementById('stat-decision-sub').textContent = dec.reasoning || '---';
      }
    }

    function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

    // ── Unified Trends chart (tabbed) ────────────────────────────────────

    function setActiveTrend(tab) {
      activeTrend = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      renderTrendsChart();
    }

    function baseChartOptions(extraScales) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: true, position: 'bottom', labels: { color: '#94a3b8', font: { family: 'Inter' } } } },
        scales: Object.assign({
          x: { ticks: { color: '#64748b' }, grid: { display: false } }
        }, extraScales),
        elements: { line: { tension: 0.4 }, point: { radius: 3, hoverRadius: 5 } }
      };
    }

    function renderTrendsChart() {
      const ctx = document.getElementById('trendsChart').getContext('2d');
      if (trendsChart) { trendsChart.destroy(); trendsChart = null; }

      let config;
      if (activeTrend === 'moisture')      config = buildMoistureChartConfig();
      else if (activeTrend === 'ambient')  config = buildAmbientChartConfig();
      else                                  config = buildWeatherChartConfig();

      trendsChart = new Chart(ctx, config);
    }

    function buildMoistureChartConfig() {
      const labels = [...new Set(history.map(h => formatDateLabel(h.recorded_at)))].reverse();
      const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6'];

      const datasets = plants.map((p, i) => {
        const plantHistory = history.filter(h => h.plant_id === p.id).reverse();
        const data = labels.map(l => {
          const entry = plantHistory.find(h => formatDateLabel(h.recorded_at) === l);
          return entry ? entry.moisture_pct : null;
        });
        return { label: p.name, data, borderColor: colors[i % colors.length], borderWidth: 2, fill: false };
      });

      return {
        type: 'line',
        data: { labels, datasets },
        options: baseChartOptions({
          y: { min: 0, max: 100, ticks: { color: '#64748b' }, grid: { color: 'rgba(51, 65, 85, 0.3)' } }
        })
      };
    }

    function buildAmbientChartConfig() {
      // One point per timestamp (ambient reading repeats across plants in
      // a single ESP32 publish cycle, so dedupe by recorded_at).
      const seen = new Set();
      const points = [];
      [...history].reverse().forEach(h => {
        if (h.temperature == null || h.humidity == null) return;
        if (seen.has(h.recorded_at)) return;
        seen.add(h.recorded_at);
        points.push(h);
      });

      return {
        type: 'line',
        data: {
          labels: points.map(h => formatDateLabel(h.recorded_at)),
          datasets: [
            { label: 'Temperature (°C)', data: points.map(h => h.temperature), borderColor: '#f59e0b', borderWidth: 2, fill: false, yAxisID: 'y' },
            { label: 'Humidity (%)',     data: points.map(h => h.humidity),    borderColor: '#3b82f6', borderWidth: 2, fill: false, yAxisID: 'y1' }
          ]
        },
        options: baseChartOptions({
          y:  { type: 'linear', position: 'left',  title: { display: true, text: '°C', color: '#64748b' }, ticks: { color: '#64748b' }, grid: { color: 'rgba(51, 65, 85, 0.3)' } },
          y1: { type: 'linear', position: 'right', title: { display: true, text: '%',  color: '#64748b' }, ticks: { color: '#64748b' }, grid: { display: false }, min: 0, max: 100 }
        })
      };
    }

    function buildWeatherChartConfig() {
      const points = [...weatherHistory].reverse(); // DESC -> chronological

      return {
        type: 'line',
        data: {
          labels: points.map(w => formatDateLabel(w.recorded_at)),
          datasets: [
            { label: 'Outdoor Temp (°C)',       data: points.map(w => w.temp),         borderColor: '#f59e0b', borderWidth: 2, fill: false, yAxisID: 'y' },
            { label: 'Rain forecast 24h (mm)',  data: points.map(w => w.rain_next24h), borderColor: '#3b82f6', borderWidth: 2, fill: false, yAxisID: 'y1' }
          ]
        },
        options: baseChartOptions({
          y:  { type: 'linear', position: 'left',  title: { display: true, text: '°C', color: '#64748b' }, ticks: { color: '#64748b' }, grid: { color: 'rgba(51, 65, 85, 0.3)' } },
          y1: { type: 'linear', position: 'right', title: { display: true, text: 'mm', color: '#64748b' }, ticks: { color: '#64748b' }, grid: { display: false }, min: 0 }
        })
      };
    }

    // ── Plant modal ───────────────────────────────────────────────────────

    function openAddModal() {
      editingId = null;
      document.getElementById('modal-title').textContent = 'Add New Pot';
      document.getElementById('form-plant-id').value = '';
      document.getElementById('form-plant-id').disabled = false;
      document.getElementById('form-name').value = '';
      document.getElementById('form-species').value = '';
      document.getElementById('form-notes').value = '';
      document.getElementById('modal-backdrop').classList.add('active');
    }

    function openEditModal(id) {
      const p = plants.find(x => x.id === id);
      if (!p) return;
      editingId = id;
      document.getElementById('modal-title').textContent = 'Edit Pot #' + id;
      document.getElementById('form-plant-id').value = p.id;
      document.getElementById('form-plant-id').disabled = true;
      document.getElementById('form-name').value = p.name;
      document.getElementById('form-species').value = p.species || '';
      document.getElementById('form-notes').value = p.notes || '';
      document.getElementById('modal-backdrop').classList.add('active');
    }

    function closeModal() { document.getElementById('modal-backdrop').classList.remove('active'); }

    async function savePlant() {
      const id = parseInt(document.getElementById('form-plant-id').value);
      const name = document.getElementById('form-name').value.trim();
      const species = document.getElementById('form-species').value.trim();
      const notes = document.getElementById('form-notes').value.trim();
      if (!id || !name) return alert('ID and Name are required');
      await api.put(`/api/plants/${id}`, { name, species, notes });
      closeModal();
      loadPlants();
    }

    async function deletePlantConfirm(id) {
      if (!confirm('Are you sure you want to delete this pot?')) return;
      await api.delete(`/api/plants/${id}`);
      loadPlants();
    }

    // ── Helpers ───────────────────────────────────────────────────────────

    function formatDateShort(iso) {
      const d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function formatDateLabel(iso) {
      const d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
      return d.getHours() + ':' + (d.getMinutes()<10?'0':'') + d.getMinutes();
    }
  </script>
</body>
</html>
